<script>
  const form = document.getElementById('dockerForm');
  const output = document.getElementById('output');
  const copyBtn = document.getElementById('copyBtn');

  async function fetchDockerfile() {
    output.textContent = "Generating...";

    const payload = {
      python_version: document.getElementById('python_version').value,
      workdir: document.getElementById('workdir').value,
      start_command: document.getElementById('start_command').value,
      exposed_port: document.getElementById('exposed_port').value,
      has_requirements: document.getElementById('has_requirements').checked
    };

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errData = await res.text();
        output.textContent = `Server Error (${res.status}):\n${errData}`;
        return;
      }

      const data = await res.json();
      output.textContent = data.dockerfile || "No Dockerfile generated.";
    } catch (err) {
      output.textContent = `Network Error:\n${err.message}\n\nNote: If testing locally, run FastAPI with uvicorn instead of opening index.html directly.`;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    fetchDockerfile();
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(output.textContent);
    copyBtn.textContent = "Copied!";
    setTimeout(() => copyBtn.textContent = "Copy", 2000);
  });

  // Fetch initial preview on page load
  fetchDockerfile();
</script>
